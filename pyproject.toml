[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-demand-crosscheck"
version = "0.1.0"
description = "Demand validation engine with resilient multi-source cross-checking"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
