name: Demand Validation Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  demand-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run validation and tests with coarse-grained retries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 10
          retry_on: error
          command: |
            pytest
