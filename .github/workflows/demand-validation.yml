name: demand-validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate-demand:
    runs-on: ubuntu-latest
    env:
      MAX_ATTEMPTS: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run demand pipeline with workflow-level retries
        run: ./scripts/run_pipeline_with_retries.sh
