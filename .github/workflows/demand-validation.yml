name: Demand Validation Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate-demand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run validation checks with workflow-level retries
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=10
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Workflow attempt $attempt/$max_attempts"
            if python -m pytest -q; then
              echo "Pipeline succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Pipeline failed after $max_attempts attempts"
              exit 1
            fi

            sleep_seconds=$((2 ** (attempt - 1)))
            echo "Retrying workflow after ${sleep_seconds}s"
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
