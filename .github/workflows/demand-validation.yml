name: demand-validation

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pipeline with workflow-level retries (up to 10 attempts)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 10
          retry_wait_seconds: 5
          command: |
            pytest -q
